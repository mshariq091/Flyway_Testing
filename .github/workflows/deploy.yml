name: Deploy Snowflake SQL

on:
  push:
    branches:
      - main
    paths:
      - 'migrations/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy migrations to Snowflake
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flyway
        uses: red-gate/setup-flyway@v3
        with:
          edition: community
          i-agree-to-the-eula: true

      - name: Check Flyway version
        run: flyway -v

      - name: Validate migrations
        env:
          FLYWAY_URL: jdbc:snowflake://${{ secrets.SNOWFLAKE_ACCOUNT }}.snowflakecomputing.com/?db=RLS_LAB&warehouse=SNOWFLAKE_LEARNING_WH&schema=DATA&JDBC_QUERY_RESULT_FORMAT=JSON
          FLYWAY_USER: ${{ secrets.SNOWFLAKE_USER }}
          FLYWAY_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          FLYWAY_LOCATIONS: filesystem:migrations
          FLYWAY_DEFAULT_SCHEMA: DATA
          FLYWAY_SCHEMAS: DATA
        run: flyway validate

      - name: Deploy pending migrations
        env:
          FLYWAY_URL: jdbc:snowflake://${{ secrets.SNOWFLAKE_ACCOUNT }}.snowflakecomputing.com/?db=RLS_LAB&warehouse=SNOWFLAKE_LEARNING_WH&schema=DATA&JDBC_QUERY_RESULT_FORMAT=JSON
          FLYWAY_USER: ${{ secrets.SNOWFLAKE_USER }}
          FLYWAY_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          FLYWAY_LOCATIONS: filesystem:migrations
          FLYWAY_DEFAULT_SCHEMA: DATA
          FLYWAY_SCHEMAS: DATA
        run: flyway migrate